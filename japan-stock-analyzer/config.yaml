# 日本株自動分析ツール 設定ファイル
# 投資方針: ミドルリスク・ミドルリターン / スイングトレード(1週間〜1ヶ月)+ 長期投資

screening:
  min_bars: 120              # 分析に必要な最低日足本数
  min_turnover_yen: 100000000  # 20日平均売買代金の下限(1億円/日) 流動性フィルタ
  price_min: 200             # 株価下限(低位株除外)
  price_max: 30000           # 株価上限
  atr_pct_min: 1.0           # ATR% 下限(値動きが小さすぎる銘柄を除外)
  atr_pct_max: 4.5           # ATR% 上限(ボラが高すぎる=ハイリスク銘柄を除外)
  min_score: 60              # ウォッチリスト追加の最低スコア
  top_n: 10                  # 1回のスクリーニングで採用する最大銘柄数
  sector_top_n: 3            # セクター(グループ)内で売買代金上位何銘柄に厳選するか
  min_market_cap_yen: 500000000000  # 時価総額の下限(5000億円)大型株に厳選
  min_equity_ratio_pct: 40.0        # 自己資本比率の下限(%)財務健全性フィルタ
  equity_ratio_exempt_groups: ["金融"]  # 銀行等は業態上自己資本比率が低いため適用除外

sector:
  bonus_top: 10       # セクター総合評価 上位3グループの銘柄への加点
  bonus_second: 5     # 4〜6位グループへの加点
  exclude_score: -2   # 総合評価がこの値以下のセクターの銘柄は新規候補から除外

fundamentals:
  cache_days: 7       # 時価総額・自己資本比率などのキャッシュ有効日数

risk:
  stop_loss_atr: 1.5         # 損切り幅 = ATR × この係数
  profit_target_atr: 2.5     # 利確幅 = ATR × この係数(スイング)
  max_stop_loss_pct: 8.0     # 損切り幅の上限(エントリー価格比 %)
  min_risk_reward: 1.5       # リスクリワード比の下限(これ未満は買い見送り)
  swing_alt_target_pct: 12.0 # スイングの代替利確目安(%)
  long_term_exit_ma: 75      # 長期保有の撤退ライン(この日数のSMAを終値で割ったら売り)

watchlist:
  max_size: 20               # ウォッチリスト最大銘柄数
  remove_score: 45           # このスコアを下回る状態が続いたら削除候補
  low_score_streak: 3        # 低スコアが何回連続したら削除するか
  max_watch_days: 60         # シグナルが出ないまま観察を続ける最大日数

trading:
  # 楽天証券/SBI証券には個人向け発注APIがないため、実口座への発注は行わない。
  # paper = 仮想売買シミュレーション(買いシグナルに従い自動執行・損益管理)/ off = 無効
  mode: paper
  initial_capital: 1000000     # ペーパートレードの初期資金(円)
  max_positions: 5             # 同時保有の最大銘柄数
  max_hold_days: 45            # 保有期間の上限(暦日)スイング想定
  budget_per_position: 300000  # 1銘柄あたりの投資予算(円)
  lot_size: 100                # 単元株数
